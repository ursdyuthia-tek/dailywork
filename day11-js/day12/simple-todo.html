<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <h2>Todo App</h2>

        <div class="input-group">

            <input type="text" id="todo-input" placeholder="Enter task...">
            <div id="task-error" class="error">
                Please enter a valid task (alphabets required)
            </div>
            <input type="number" id="time-input" placeholder="Time (in hrs)" min="1">
            <div id="time-error" class="error">
                Please enter valid time (> 0)
            </div>
            <select id="priority-input">
                <option value="">Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
            <div id="priority-error" class="error">
                Please select a priority
            </div>
            <button onclick="addTodo()">Add</button>
            <button onclick="sortTodos()">Sort by name</button>
        </div>
        <ul id="todo-list"></ul>
    </div>
    <script src="app.js"></script>
</body>

</html>
